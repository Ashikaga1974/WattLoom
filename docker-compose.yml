services:
  wattloom:
    build: .
    ports:
      # Standardmäßig nur vom eigenen Rechner erreichbar – WattLoom hat keine Authentifizierung.
      # LAN-Zugriff bewusst freischalten: WATTLOOM_BIND=0.0.0.0 docker compose up
      - "${WATTLOOM_BIND:-127.0.0.1}:${WATTLOOM_PORT:-8000}:8000"
    volumes:
      - ./wattloom-data:/data
    restart: unless-stopped
