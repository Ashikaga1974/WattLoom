name: Pages

on:
  push:
    branches: [main]
    # Workflow-Datei mit drin, damit eine Änderung daran ebenfalls neu deployt
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende nicht abbrechen, damit kein halbes Deployment entsteht
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # docs/ ist reines HTML – kein Jekyll-Build nötig
      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
