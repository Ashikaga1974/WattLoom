name: Build Windows executable

# Manuell auslösbar (Actions-Tab → "Run workflow") sowie bei Tags wie "v1.0.0" –
# so entsteht ein Windows-Build, ohne dass Sascha selbst eine Windows-Maschine braucht.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend-Abhängigkeiten installieren
        run: pip install -r requirements-build.txt

      - name: PyInstaller-Build
        run: pyinstaller wattloom.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: WattLoom-windows
          path: dist/WattLoom/

      - name: Zip fürs Release schnüren
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/WattLoom/* -DestinationPath WattLoom-windows.zip

      # Hängt die Zip als Asset an den bestehenden Tag-Release an, statt sie nur als
      # (für unerfahrene Nutzer schwer auffindbares, login-pflichtiges) Actions-Artefakt
      # liegen zu lassen – Releases sind über die Repo-Sidebar ohne Login erreichbar.
      - name: Release-Asset hochladen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WattLoom-windows.zip
