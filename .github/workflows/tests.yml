name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Vom Windows-Build vor dem Release aufgerufen, damit kein Tag auf kaputtem Stand gebaut wird
  workflow_call:

# Neuer Push auf denselben Branch/PR macht den älteren Lauf überflüssig
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      # Root-tsconfig.json enthält nur references – ohne -p tsconfig.app.json prüft tsc nichts
      - name: TypeScript prüfen
        run: npx tsc --noEmit -p tsconfig.app.json

      # Blockierend für Fehler; die verbliebenen exhaustive-deps-Warnungen lassen den Job nicht scheitern
      - name: ESLint
        run: npm run lint
